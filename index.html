
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的云端记账本</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
main{max-width:760px;margin:auto;padding:18px}
h1{font-size:25px;margin:8px 0}
h2{font-size:19px;margin:0 0 18px}
p{line-height:1.65}
.muted{font-size:13px;color:#64748b}
.card{background:white;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 3px 15px #182b4d0a}
.hero{background:linear-gradient(125deg,#2563eb,#7446dc);color:white;border-radius:20px;padding:27px;margin-top:20px}
.total{font-size:38px;font-weight:750;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:600;font-size:14px;margin:13px 0 7px}
input,select{width:100%;padding:12px;border:1px solid #d9e2ef;border-radius:10px;background:white;font-size:16px}
button{border:0;border-radius:10px;padding:12px;cursor:pointer;font-size:14px}
.primary{background:#2563eb;color:white;font-weight:650}
.secondary{background:#eff6ff;color:#1d4ed8}
.danger{background:#fff1f2;color:#e11d48}
.full{width:100%;margin-top:15px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.buttons button{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid #edf2f7}
.row:last-child{border:0}
.small{font-size:12px;color:#8491a5;margin-top:5px}
.bar{height:9px;background:#edf2f7;border-radius:20px;overflow:hidden;margin:8px 0 15px}
.fill{height:100%;background:linear-gradient(90deg,#2563eb,#8b5cf6)}
.empty{text-align:center;color:#94a3b8;padding:22px}
.hidden{display:none}
#message{margin-top:12px;white-space:pre-wrap;font-size:14px}
.ok{color:#15803d}
.error{color:#dc2626}
footer{text-align:center;font-size:12px;color:#94a3b8;padding:26px}
@media(max-width:480px){
.grid{grid-template-columns:1fr}
.buttons{flex-direction:column}
.total{font-size:32px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<main>
<h1>☁️ 我的云端记账本</h1>
<p class="muted">安全登录 · 云端保存 · 手机电脑同步</p>

<section class="card" id="loginBox">
<h2>🔐 登录记账账号</h2>
<label>电子邮箱</label>
<input id="email" type="email" autocomplete="email" placeholder="请输入邮箱">
<label>密码</label>
<input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
<div class="buttons">
<button class="primary" id="loginBtn">登录</button>
<button class="secondary" id="signupBtn">注册新账号</button>
</div>
<p class="muted">首次注册后，请按邮件提示验证邮箱，再登录。</p>
</section>

<div id="app" class="hidden">
<section class="card">
<div class="row">
<div>
<strong>👤 已登录</strong>
<div class="small" id="userEmail"></div>
</div>
<button class="secondary" id="logoutBtn">退出登录</button>
</div>
<p class="muted">☁️ 消费记录保存在 Supabase 云端。</p>
<button class="secondary full" id="refreshBtn">🔄 刷新云端账单</button>
</section>

<section class="hero">
<div>累计总支出</div>
<div class="total" id="total">¥0.00</div>
<div id="count">0 笔消费</div>
</section>

<section class="card">
<h2>✏️ 添加消费记录</h2>
<form id="expenseForm">
<div class="grid">
<div>
<label>金额（元）</label>
<input id="amount" type="number" min="0.01" max="999999999" step="0.01" required>
</div>
<div>
<label>分类</label>
<select id="category">
<option>餐饮</option>
<option>购物</option>
<option>交通</option>
<option>娱乐</option>
<option>其他</option>
</select>
</div>
</div>
<label>消费项目</label>
<input id="name" required maxlength="60" placeholder="例如：午餐">
<button class="primary full" type="submit">＋ 保存到云端</button>
</form>
</section>

<section class="card">
<h2>📅 每月消费统计</h2>
<label>选择月份</label>
<input id="month" type="month">
<div class="grid" style="margin-top:18px">
<div><span class="muted">本月支出</span><h2 id="monthTotal">¥0.00</h2></div>
<div><span class="muted">消费笔数</span><h2 id="monthCount">0 笔</h2></div>
</div>
<div id="stats"></div>
</section>

<section class="card">
<h2>📋 当月消费明细</h2>
<div id="records"></div>
</section>

<section class="card">
<h2>💾 备份与旧账单迁移</h2>
<div class="buttons">
<button class="secondary" id="jsonBtn">下载 JSON 备份</button>
<button class="secondary" id="csvBtn">导出 Excel CSV</button>
</div>
<label>导入旧记账网站的 JSON 文件</label>
<input id="importFile" type="file" accept=".json,application/json">
<p class="muted">导入会向云端添加备份中尚不存在的记录，不会删除云端已有记录。请先下载最新备份，避免误操作。</p>
</section>
</div>

<p id="message" role="status" aria-live="polite"></p>
<footer>我的云端记账本 · 请定期备份重要账单</footer>
</main>

<script>
const SUPABASE_URL =
  "https://joyqlelzapraawudhuxn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7_nDQatwVBChB4yotQ8YwA_ugViwwAL";

const $ = id => document.getElementById(id);
const money = n => "¥" + Number(n).toFixed(2);
const categories = ["餐饮","购物","交通","娱乐","其他"];
let db, user = null, expenses = [];

function msg(text, error=false){
  $("message").textContent=text;
  $("message").className=error?"error":"ok";
}

function localMonth(date){
  const d=new Date(date);
  if(Number.isNaN(d.getTime()))return "";
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function parseOldDate(value){
  if(typeof value!=="string")return null;
  const match=value.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})(?:[ ,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(!match)return null;
  const d=new Date(
    Number(match[1]),Number(match[2])-1,Number(match[3]),
    Number(match[4]||0),Number(match[5]||0),Number(match[6]||0)
  );
  if(Number.isNaN(d.getTime())||
     d.getFullYear()!==Number(match[1])||
     d.getMonth()!==Number(match[2])-1||
     d.getDate()!==Number(match[3]))return null;
  return d.toISOString();
}

function showLogin(){
  user=null;
  expenses=[];
  $("loginBox").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function showApp(){
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userEmail").textContent=user.email||"";
}

function fail(error){
  console.error(error);
  msg(error?.message||"操作失败，请检查网络连接",true);
}

async function load(){
  if(!user)return;
  const {data,error}=await db.from("expenses")
    .select("id,amount,name,category,date")
    .eq("user_id",user.id)
    .order("date",{ascending:false})
    .limit(10000);
  if(error){fail(error);return;}
  expenses=data||[];
  render();
  msg("云端账单已更新");
}

function render(){
  $("total").textContent=money(
    expenses.reduce((s,x)=>s+Number(x.amount),0)
  );
  $("count").textContent=expenses.length+" 笔消费";

  const selected=$("month").value;
  const monthly=expenses.filter(x=>localMonth(x.date)===selected);
  const total=monthly.reduce((s,x)=>s+Number(x.amount),0);

  $("monthTotal").textContent=money(total);
  $("monthCount").textContent=monthly.length+" 笔";

  const stats=$("stats");
  stats.replaceChildren();

  categories.forEach(cat=>{
    const n=monthly.filter(x=>x.category===cat)
      .reduce((s,x)=>s+Number(x.amount),0);
    const block=document.createElement("div");
    const label=document.createElement("div");
    label.textContent=cat+"："+money(n);
    const bar=document.createElement("div");
    bar.className="bar";
    const fill=document.createElement("div");
    fill.className="fill";
    fill.style.width=(total?n/total*100:0)+"%";
    bar.append(fill);
    block.append(label,bar);
    stats.append(block);
  });

  const list=$("records");
  list.replaceChildren();

  if(!monthly.length){
    const p=document.createElement("div");
    p.className="empty";
    p.textContent="这个月暂时没有消费记录";
    list.append(p);
  }

  monthly.forEach(x=>{
    const row=document.createElement("div");
    row.className="row";
    const left=document.createElement("div");
    const title=document.createElement("strong");
    title.textContent=x.name;
    const meta=document.createElement("div");
    meta.className="small";
    meta.textContent=x.category+" · "+
      new Date(x.date).toLocaleString("zh-CN");
    left.append(title,meta);

    const right=document.createElement("div");
    right.style.cssText="display:flex;gap:10px;align-items:center";
    const price=document.createElement("strong");
    price.textContent="-"+money(x.amount);
    const del=document.createElement("button");
    del.className="danger";
    del.textContent="删除";
    del.onclick=async()=>{
      if(!confirm("确定删除这笔账单吗？"))return;
      const {error}=await db.from("expenses")
        .delete().eq("id",x.id).eq("user_id",user.id);
      if(error){fail(error);return;}
      await load();
    };
    right.append(price,del);
    row.append(left,right);
    list.append(row);
  });
}

async function login(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password){msg("请输入邮箱和密码",true);return;}
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){fail(error);return;}
  user=data.user;
  showApp();
  await load();
}

async function signup(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||password.length<12){
    msg("请填写邮箱，并设置至少12位密码",true);
    return;
  }
  const {data,error}=await db.auth.signUp({
    email,password,
    options:{emailRedirectTo:location.origin+location.pathname}
  });
  if(error){fail(error);return;}
  if(data.session){
    user=data.user;
    showApp();
    await load();
  }else{
    msg("注册请求已提交。请查看邮箱验证邮件，验证后再登录。");
  }
}

$("loginBtn").onclick=login;
$("signupBtn").onclick=signup;

$("logoutBtn").onclick=async()=>{
  const {error}=await db.auth.signOut();
  if(error){fail(error);return;}
  showLogin();
  msg("已退出登录");
};

$("refreshBtn").onclick=load;
$("month").addEventListener("change",render);

$("expenseForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!user)return;
  const amount=Number($("amount").value);
  const name=$("name").value.trim();
  const category=$("category").value;

  if(!Number.isFinite(amount)||amount<=0||amount>999999999||
     !name||!categories.includes(category)){
    msg("请检查金额和消费项目",true);return;
  }

  const {error}=await db.from("expenses").insert({
    user_id:user.id,
    amount:Math.round(amount*100)/100,
    name,category,
    date:new Date().toISOString()
  });
  if(error){fail(error);return;}
  e.target.reset();
  $("month").value=localMonth(new Date());
  await load();
});

function download(filename,content,type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

$("jsonBtn").onclick=()=>{
  download("云端记账备份.json",JSON.stringify(expenses,null,2),
    "application/json;charset=utf-8");
};

function csvCell(value){
  let text=String(value??"");
  if(/^\s*[=+\-@\t\r]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}

$("csvBtn").onclick=()=>{
  const rows=[["日期","项目","分类","金额"]];
  expenses.forEach(x=>rows.push([
    new Date(x.date).toLocaleString("zh-CN"),
    x.name,x.category,x.amount
  ]));
  const csv="\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  download("云端消费账单.csv",csv,"text/csv;charset=utf-8");
};

$("importFile").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file||!user)return;
  try{
    if(file.size>5*1024*1024)throw Error("文件不能超过5MB");
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data)||data.length>10000)
      throw Error("备份文件格式不正确");

    const normalized=data.map(x=>{
      if(!x||typeof x!=="object")throw Error("记录无效");
      const date=parseOldDate(x.date);
      const amount=Number(x.amount);
      if(!date||!Number.isFinite(amount)||amount<=0||
         amount>999999999||typeof x.name!=="string"||
         !x.name.trim()||x.name.length>60||
         !categories.includes(x.category))
        throw Error("备份中有无法识别的记录");
      return {
        name:x.name.trim(),
        category:x.category,
        amount:Math.round(amount*100)/100,
        date
      };
    });

    await load();

    const signature=x=>[
      x.name,x.category,Number(x.amount).toFixed(2),
      new Date(x.date).toISOString()
    ].join("|");

    const existing=new Set(expenses.map(signature));
    const toAdd=[];

    for(const x of normalized){
      const key=signature(x);
      if(!existing.has(key)){
        toAdd.push({...x,user_id:user.id});
        existing.add(key);
      }
    }

    if(!toAdd.length){
      msg("备份中的记录已经存在，无需重复导入");
      return;
    }

    if(!confirm("准备导入 "+toAdd.length+
      " 笔记录到云端。请确认你已保存备份，是否继续？"))return;

    for(let i=0;i<toAdd.length;i+=100){
      const {error}=await db.from("expenses")
        .insert(toAdd.slice(i,i+100));
      if(error)throw error;
    }

    await load();
    msg("导入成功，共新增 "+toAdd.length+" 笔记录");
  }catch(error){
    fail(error);
  }finally{
    e.target.value="";
  }
});

async function start(){
  if(!SUPABASE_KEY.startsWith("sb_publishable_")){
    msg("请先在代码中填写完整的 Supabase Publishable Key",true);
    return;
  }
  if(!window.supabase){
    msg("连接组件加载失败，请检查网络",true);
    return;
  }

  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const now=new Date();
  $("month").value=localMonth(now);

  const {data,error}=await db.auth.getUser();
  if(!error&&data.user){
    user=data.user;
    showApp();
    await load();
  }else{
    showLogin();
  }

  db.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_OUT"){
      showLogin();
    }
    if(event==="TOKEN_REFRESHED"&&!session){
      showLogin();
    }
  });
}

start().catch(fail);
</script>
</body>
</html>
