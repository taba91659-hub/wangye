<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://joyqlelzapraawudhuxn.supabase.co; base-uri 'none'; form-action 'none'">
<title>确认删除账单 · 我的记账本</title><link rel="stylesheet" href="./oauth-consent.css">
</head><body><main>
<p class="eyebrow">我的智能记账本</p><h1>确认删除这笔账单</h1>
<p>请逐项核对，点击“确认删除这笔账单”后才会删除。删除无法通过此页撤销，请谨慎核对。请求有效期为 15 分钟。</p>
<p id="status" role="status" aria-live="polite">正在检查…</p>
<form id="login" hidden>
<h2>登录你的记账账号</h2>
<label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required maxlength="254">
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
<button id="login-button" type="submit">登录并查看草稿</button></form>
<section id="draft" hidden><dl>
<dt>所属账号</dt><dd id="account"></dd><dt>名称</dt><dd id="name"></dd>
<dt>金额（人民币）</dt><dd id="amount"></dd><dt>分类</dt><dd id="category"></dd>
<dt>日期（北京时间）</dt><dd id="date"></dd></dl>
<p>内容不对时请关闭此页，回到 ChatGPT 重新描述；账单不会自动删除。</p>
<button id="confirm" type="button">确认删除这笔账单</button>
<button id="refresh" type="button" class="secondary">检查删除状态</button>
</section>
<button id="signout" type="button" class="secondary" hidden>退出此确认页账号</button>
<p><a href="./index.html">打开记账本</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" defer></script>
<script src="./expense-delete.js" defer></script>
</body></html>
